name: Build & Release Signed PURR-TTS Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach APK builds to (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fetch Prebuilt sherpa-onnx Android JNI AAR (v1.13.8 with espeak-ng G2P)
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/sherpa-onnx-1.13.8.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          curl -fSL -o /tmp/ort-android.aar \
            "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.31.1/onnxruntime-android-1.31.1.aar"
          # Keep single unified libonnxruntime.so from onnxruntime-android 1.31.1 AND align
          # sherpa-onnx ELF symbol versions (.gnu.version_r VERS_1.28.2 -> VERS_1.31.1) so Android Bionic loads cleanly.
          python3 scripts/align_sherpa_ort_abi.py \
            --sherpa-aar app/libs/sherpa-onnx-1.13.8.aar \
            --ort-aar /tmp/ort-android.aar
          ls -lh app/libs/sherpa-onnx-1.13.8.aar

      - name: Fetch Native Qwen3-TTS (LunaVox + llama.cpp b8470 + ORT Headers)
        run: |
          TP_DIR="app/src/main/cpp/third_party"
          rm -rf "$TP_DIR"
          mkdir -p "$TP_DIR/onnxruntime/include"
          git clone --depth 1 --branch b8470 https://github.com/ggml-org/llama.cpp.git "$TP_DIR/llama.cpp"
          git clone https://github.com/Lux-Luna/LunaVox.git "$TP_DIR/lunavox"
          git -C "$TP_DIR/lunavox" checkout ae5db5cd
          # ✨ GPU OFFLOAD + 4D M-ROPE BATCH FIX PATCH (v1.8.2 / v2.2.2):
          # 1) Routes TalkerPredictor::load n_gpu_layers through runtime gate (0 = CPU, -1 = Adreno OpenCL).
          # 2) Scales talker_batch_ capacity by 4x for Qwen3 4D M-RoPE positions so prompts >=193 tokens never fail.
          # 3) Clamps max_frames inside talker_ctx_cap_ so long bubbles/seeds never fail with context overflow.
          git -C "$TP_DIR/lunavox" apply --check "$GITHUB_WORKSPACE/patches/lunavox_opencl_gpu_offload.patch"
          git -C "$TP_DIR/lunavox" apply "$GITHUB_WORKSPACE/patches/lunavox_opencl_gpu_offload.patch"
          if [ ! -f /tmp/ort-android.aar ]; then
            curl -fSL -o /tmp/ort-android.aar \
              "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.31.1/onnxruntime-android-1.31.1.aar"
          fi
          unzip -q /tmp/ort-android.aar "headers/*" "jni/arm64-v8a/libonnxruntime.so" "jni/x86_64/libonnxruntime.so" -d "$TP_DIR/onnxruntime"
          mv "$TP_DIR/onnxruntime/headers/"* "$TP_DIR/onnxruntime/include/"
          rm -rf /tmp/ort-android.aar "$TP_DIR/onnxruntime/headers"
          ls -la "$TP_DIR/onnxruntime/include" "$TP_DIR/lunavox/src"

      - name: Verify project manifests & structure
        run: python3 scripts/verify_project.py

      - name: Prepare Persistent Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.PURR_RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PURR_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.PURR_KEY_ALIAS }}
          K_PASS: ${{ secrets.PURR_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASS=$K_PASS" >> "$GITHUB_ENV"
            keytool -list -v -keystore release.keystore -storepass "$KS_PASS" -alias "$KS_ALIAS" \
              | grep -E "Alias name:|Signature algorithm|SHA256:"
            echo "Using persistent release signing keystore (in-place upgrades preserved)."
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Error: PURR_RELEASE_KEYSTORE_B64 secret missing on tagged release build!" >&2
            exit 1
          else
            echo "No persistent keystore secret configured (e.g. PR); generating ephemeral test keystore."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias purrtts \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass purrtts -keypass purrtts \
              -dname "CN=Project MIKA, OU=PURR Engine, O=ProjectMIKA, L=Cyber, S=Matrix, C=US"
          fi

      - name: Run JVM unit tests & build signed Release APK
        run: gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Package & Verify Signed Release APKs
        run: |
          mkdir -p builds
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Error: Release APK not found at $APK_SRC" >&2
            exit 1
          fi
          python3 scripts/align_sherpa_ort_abi.py --verify-apk "$APK_SRC"
          cp "$APK_SRC" "builds/PURR-Engine_V${VERSION}_Android.apk"
          cp "$APK_SRC" "builds/PURR-TTS_V${VERSION}.apk"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "builds/PURR-Engine_V${VERSION}_Android.apk"
          else
            echo "apksigner not found; listing APK META-INF entries"
          fi
          ls -lh builds/*.apk

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PURR-TTS-Release-APKs
          path: builds/*.apk

      - name: Attach Signed APKs to GitHub Release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ "$TAG" != v* ]]; then
            TAG="v${VERSION}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "builds/PURR-Engine_V${VERSION}_Android.apk" \
              "builds/PURR-TTS_V${VERSION}.apk" \
              --clobber
          else
            echo "Release $TAG does not exist yet; skipping upload."
          fi
